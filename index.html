<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Number Kingdom &middot; Class 4 Maths &middot; Chapter 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
.wrap{ width:92vw; max-width:62rem; margin:0 auto; padding:1.4rem 0 3rem; }

/* ---------- HEADER ---------- */
.hero{
  display:flex; align-items:center; justify-content:space-between; gap:1.2rem;
  flex-wrap:wrap;
  padding:1rem 1.3rem;
  background:var(--surface); border:2px solid var(--surface-line);
  border-radius:var(--r-lg);
}
.hero-text{ flex:1 1 16rem; }
.eyebrow{
  display:inline-block; font-size:.55rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:.2rem;
}
.hero h1{ font-size:1.7rem; line-height:1.05; letter-spacing:-.02em; }
.hero h1 em{ font-style:normal; color:#A85A2E; }

.stats{ display:flex; gap:.5rem; }
.stat{
  background:var(--peach-bg); border:2px solid var(--peach-line);
  border-radius:var(--r-md);
  padding:.5rem .9rem; min-width:5.4rem; text-align:center;
  box-shadow:inset 0 .1rem 0 rgba(255,255,255,.9),
             0 .18rem 0 var(--peach-line),
             0 .3rem .42rem rgba(96,74,52,.14);
}
.stat .num{ display:block; font-size:1.6rem; line-height:1.05; color:var(--peach-ink); }
.stat .lbl{ display:block; font-size:.5rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }

/* ---------- SECTION ---------- */
.section{ margin-top:1.6rem; }
.section-head{ display:flex; align-items:center; gap:.7rem; margin-bottom:.8rem; }
.section-head h2{ font-size:.85rem; line-height:1.2; white-space:nowrap; }
.rule{ flex:1 1 2rem; height:2px; background:var(--surface-line); border-radius:2px; }

/* ---------- CARDS ---------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr)); gap:.8rem; }

.card{
  display:flex; flex-direction:column;
  background:var(--surface);
  border:2px solid var(--surface-line);
  border-radius:var(--r-lg);
  overflow:hidden;
  box-shadow:inset 0 .1rem 0 rgba(255,255,255,.9),
             0 .2rem 0 var(--surface-line),
             0 .34rem .5rem rgba(96,74,52,.14);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.card:hover,.card:focus-within{
  border-color:#DE8A5C; transform:translateY(-.18rem);
  box-shadow:inset 0 .1rem 0 rgba(255,255,255,.9),
             0 .3rem 0 #DE8A5C,
             0 .5rem .8rem rgba(96,74,52,.2);
}

/* the little picture of the game inside */
.preview{
  height:4.6rem;
  background:var(--sand-bg);
  border-bottom:2px solid var(--surface-line);
  padding:.5rem .6rem;
  display:grid; place-items:center;
}
.preview svg{ width:100%; height:100%; }

.card-body{ padding:.7rem .8rem .7rem; flex:1 1 auto; display:flex; flex-direction:column; }
.card-top{ display:flex; align-items:flex-start; gap:.45rem; }
.qnum{
  flex:none; display:grid; place-items:center;
  width:1.3rem; height:1.3rem; border-radius:var(--r-sm);
  background:var(--sand-bg); border:1.5px solid var(--sand-line);
  color:var(--ink); font-size:.6rem;
}
.card h3{ font-size:.82rem; line-height:1.25; }
.card p{ font-size:.7rem; line-height:1.4; margin-top:.35rem; color:var(--ink-soft); }

.card-play{ display:flex; justify-content:center; margin-top:auto; padding:.7rem 0 0; }
.play.big{
  display:inline-flex; align-items:center; justify-content:center; gap:.3rem;
  width:100%; padding:.45rem .9rem; border-radius:2rem;
  border:2px solid #DE8A5C; background:#A85A2E; color:#fff;
  box-shadow:inset 0 .1rem 0 rgba(255,255,255,.55),
             inset 0 -.22rem .3rem -.14rem rgba(0,60,45,.22),
             0 .18rem 0 #DE8A5C,
             0 .3rem .42rem rgba(30,110,90,.28);
  font-size:.7rem;
  transition:transform .14s ease, background .16s ease, box-shadow .14s ease;
}
.play.big svg{ width:.72rem; height:.72rem; fill:currentColor; }
.play.big:hover{
  transform:translateY(-.1rem); background:#C06A35;
  box-shadow:inset 0 .1rem 0 rgba(255,255,255,.55),
             0 .28rem 0 #DE8A5C, 0 .44rem .6rem rgba(30,110,90,.32);
}
.play.big:active{
  transform:translateY(.14rem);
  box-shadow:inset 0 .1rem 0 rgba(255,255,255,.5), 0 .04rem 0 #DE8A5C;
}
.play.big[data-ready="0"]{
  background:var(--sand-bg); border-color:var(--sand-line); color:var(--sand-ink);
  box-shadow:inset 0 .1rem 0 rgba(255,255,255,.8), 0 .18rem 0 var(--sand-line);
}

/* ---------- TOAST ---------- */
.toast{
  position:fixed; left:50%; bottom:1.2rem; transform:translate(-50%,1.4rem);
  background:var(--ink); color:#fff; font-size:.55rem;
  padding:.5rem .9rem; border-radius:2rem;
  opacity:0; pointer-events:none;
  transition:opacity .22s ease,transform .22s ease; z-index:50;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-text">
      <span class="eyebrow">Class 4 · Mathematics</span>
      <h1>Chapter 1 &mdash; <em>Numbers</em></h1>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="stat-count">0</span><span class="lbl">Activities</span></div>
    </div>
  </header>

  <main id="sections"></main>


</div>

<div class="toast" id="toast"></div>

<script src="js/index.js?v=3"></script>
</body>
</html>
