<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare and order &middot; Launch Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/quiz.css">
<style>
.duel{ display:flex; align-items:center; justify-content:center; gap:1.2rem; font-size:1.2rem; margin:.5rem 0; }
.duel .n{
  background:linear-gradient(180deg, #FFF8E1 0%, #FFECB3 100%);
  border:2px solid #FFD54F; border-radius:1rem;
  padding:.6rem 1.5rem; font-weight:700; color:#5D4037;
  font-size:1.8rem; letter-spacing:.03em;
  box-shadow:0 3px 10px rgba(255,213,79,.25);
}
.duel .gap{
  width:3rem; text-align:center; color:var(--accent);
  font-size:2rem; font-weight:700;
}
</style>
</head>
<body>
<div class="shell">

  <div class="bar">
    <a class="back" href="../index.html" aria-label="Back to activities">
      <svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4L10.8 12l6-6z"/></svg>
    </a>
    <div class="bar-text">
      <span class="kicker" id="q-kicker"></span>
      <h1 id="q-title"></h1>
    </div>
    <span class="count" id="q-count"></span>
  </div>
  <div class="track"><span id="q-bar"></span></div>

  <section class="qcard" id="q-card">
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="q-hint"></p>
    <div class="stage" id="q-stage"></div>
    <div class="feedback" id="q-feed"></div>
    <div class="actions">
      <button class="btn prev-btn" id="q-prev" disabled>← Prev</button>
      <button class="btn check-btn" id="q-primary">Check</button>
      <button class="btn next-btn" id="q-next">Next →</button>
    </div>
  </section>

  <section class="qcard result" id="q-result">
    <div class="score" id="q-score"></div>
    <div class="of" id="q-of"></div>
    <div class="stars" id="q-stars"></div>
    <h2 id="q-verdict"></h2>
    <p id="q-blurb"></p>
    <div class="actions">
      <button class="btn ghost" id="q-again">Play again</button>
      <a class="btn" href="../index.html">Back to activities</a>
    </div>
  </section>

</div>

<script src="../js/quiz.js"></script>
<script src="../js/compare-and-order.js"></script>
</body>
</html>
