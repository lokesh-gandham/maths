<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smallest and greatest &middot; Comparing and Arranging Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/quiz.css">
<link rel="stylesheet" href="../css/smallest-and-greatest.css">
</head>
<body class="page-sag">
<div class="shell">

  <div class="bar">
    <a class="back" href="../index.html" aria-label="Back to activities">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <div class="bar-text">
      <span class="kicker" id="q-kicker"></span>
      <h1 id="q-title"></h1>
    </div>
    <span class="count" id="q-count"></span>
  </div>
  <div class="track"><span id="q-bar"></span></div>

  <section class="qcard" id="q-card">
    <p class="prompt" id="q-prompt"></p>
    <p class="hint" id="q-hint"></p>
    <div class="stage" id="q-stage"></div>
    <div class="feedback" id="q-feed"></div>
    <div class="actions">
      <button class="btn prev-btn" id="q-prev" style="display:none" disabled>&larr; Prev</button>
      <button class="btn check-btn" id="q-primary">Check</button>
      <button class="btn next-btn" id="q-next" style="display:none">Next &rarr;</button>
    </div>
  </section>

  <section class="qcard result" id="q-result">
    <div class="score" id="q-score"></div>
    <div class="of" id="q-of"></div>
    <div class="stars" id="q-stars"></div>
    <h2 id="q-verdict"></h2>
    <p id="q-blurb"></p>
    <div class="actions">
      <button class="btn ghost" id="q-again">Play again</button>
      <a class="btn" href="../index.html">Back to activities</a>
    </div>
  </section>

</div>

<script src="../js/quiz.js"></script>
<script src="../js/smallest-and-greatest.js"></script>
</body>
</html>
