<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Even or Odd Number Challenge</title>
<link rel="stylesheet" href="../css/even-or-odd-sort.css">
</head>
<body>
<div class="activity-shell">

  <div class="progress-row">
    <span class="progress-icon" aria-hidden="true">✏️</span>
    <div class="progress-track" role="progressbar" aria-label="Numbers marked" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress-track">
      <span class="progress-bar" id="progress-bar"></span>
    </div>
  </div>

  <main class="worksheet">
    <div class="worksheet-content">
      <section class="instruction-card">
        <span class="instruction-number">8</span>
        <div>
          <h2>Circle the even numbers and cross out the odd numbers.</h2>
          <p>Choose a marking tool, then select each number.</p>
        </div>
      </section>

      <section class="tool-section">
        <p class="tool-heading">Choose your marking tool</p>
        <div class="tool-selector" role="group" aria-label="Choose a marking tool">
          <button class="tool-button circle-tool active" id="circle-tool" type="button" aria-pressed="true">
            <span class="tool-symbol" aria-hidden="true">○</span>
            Circle Even
          </button>
          <button class="tool-button cross-tool" id="cross-tool" type="button" aria-pressed="false">
            <span class="tool-symbol" aria-hidden="true">╱</span>
            Cross Out Odd
          </button>
        </div>
      </section>

      <section class="number-board" aria-label="Numbers to classify" id="number-board"></section>

      <div class="activity-feedback" id="activity-feedback" role="status" aria-live="polite">
        Circle tool selected. Start marking the numbers.
      </div>

      <div class="activity-actions">
        <button class="action-button secondary" id="clear-button" type="button">Clear Marks</button>
        <button class="action-button" id="check-button" type="button" disabled>Check Answers</button>
      </div>
    </div>
  </main>

</div>

<div class="popup-overlay" id="popup-overlay" aria-hidden="true">
  <section class="popup-card" id="popup-card" role="status" aria-live="polite" aria-atomic="true">
    <div class="popup-decoration" aria-hidden="true"></div>
    <div class="popup-icon" id="popup-icon" aria-hidden="true">🎉</div>
    <span class="popup-label" id="popup-label">Activity Complete</span>
    <h2 class="popup-title" id="popup-title">Congratulations!</h2>
    <p class="popup-message" id="popup-message">Every number was marked correctly.</p>
    <div class="popup-score" id="popup-score">10 / 10</div>
    <div class="popup-stars" id="popup-stars" aria-label="Result stars">⭐⭐⭐</div>
    <div class="popup-timer" aria-hidden="true"><span></span></div>
  </section>
</div>

<script src="../js/even-or-odd-sort.js"></script>
</body>
</html>
